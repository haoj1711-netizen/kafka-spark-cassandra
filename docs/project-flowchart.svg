<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920" role="img" aria-labelledby="title desc">
  <title id="title">Kafka Spark Cassandra streaming pipeline</title>
  <desc id="desc">High-level flow from Random User API through an Airflow producer, Kafka, Spark Structured Streaming, and Cassandra, with supporting local infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <marker id="arrowGap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/></marker>
    <style>
      .section{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:24;filter:url(#shadow)}.node{stroke-width:2;rx:18;filter:url(#shadow)}
      .source{fill:#eef2ff;stroke:#4f46e5}.airflow{fill:#eff6ff;stroke:#2563eb}.kafka{fill:#fff7ed;stroke:#f97316}.spark{fill:#fefce8;stroke:#ca8a04}.cassandra{fill:#ecfeff;stroke:#0891b2}.support{fill:#f8fafc;stroke:#64748b}.gap{fill:#faf5ff;stroke:#7c3aed;stroke-dasharray:8 6}
      .title{font:800 34px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.subtitle{font:17px 'Segoe UI',Arial,sans-serif;fill:#64748b}.section-title{font:700 23px 'Segoe UI',Arial,sans-serif;fill:#334155}.h{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.t{font:15px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:13px 'Segoe UI',Arial,sans-serif;fill:#475569}.label{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrowGap)}
    </style>
  </defs>
  <rect width="1800" height="920" fill="url(#bg)"/>
  <text class="title" x="65" y="62">Kafka + Spark + Cassandra — High-Level Flow</text>
  <text class="subtitle" x="65" y="96">Local Docker streaming demo • Airflow produces • Kafka transports • Spark processes • Cassandra stores</text>

  <rect class="section" x="45" y="130" width="1710" height="370"/>
  <text class="section-title" x="75" y="174">Primary data path</text>
  <rect class="node source" x="80" y="240" width="260" height="135"/><text class="h" x="210" y="284" text-anchor="middle">Random User API</text><text class="t" x="210" y="317" text-anchor="middle">Synthetic user profiles</text><text class="small" x="210" y="344" text-anchor="middle">HTTPS; no API token</text>
  <rect class="node airflow" x="420" y="220" width="285" height="175"/><text class="h" x="562" y="263" text-anchor="middle">Apache Airflow</text><text class="t" x="562" y="296" text-anchor="middle">user_automation DAG</text><text class="small" x="562" y="326" text-anchor="middle">Daily 60-second producer burst</text><text class="small" x="562" y="351" text-anchor="middle">~1 API request/message per second</text><text class="small" x="562" y="376" text-anchor="middle">JSON serialization</text>
  <rect class="node kafka" x="790" y="230" width="270" height="155"/><text class="h" x="925" y="273" text-anchor="middle">Apache Kafka</text><text class="t" x="925" y="306" text-anchor="middle">users_created</text><text class="small" x="925" y="335" text-anchor="middle">Raw JSON event topic</text><text class="small" x="925" y="360" text-anchor="middle">Local PLAINTEXT listener</text>
  <rect class="node spark" x="1145" y="220" width="300" height="175"/><text class="h" x="1295" y="263" text-anchor="middle">Spark Structured Streaming</text><text class="t" x="1295" y="296" text-anchor="middle">spark_stream.py</text><text class="small" x="1295" y="326" text-anchor="middle">Consume → parse JSON schema</text><text class="small" x="1295" y="351" text-anchor="middle">Checkpoint streaming progress</text><text class="small" x="1295" y="376" text-anchor="middle">Cassandra connector sink</text>
  <rect class="node cassandra" x="1530" y="230" width="190" height="155"/><text class="h" x="1625" y="273" text-anchor="middle">Cassandra</text><text class="t" x="1625" y="306" text-anchor="middle">spark_streams</text><text class="small" x="1625" y="335" text-anchor="middle">created_users</text><text class="small" x="1625" y="360" text-anchor="middle">UUID primary key</text>
  <path class="arrow" d="M340 307 H420"/><text class="label" x="380" y="290" text-anchor="middle">fetch</text>
  <path class="arrow" d="M705 307 H790"/><text class="label" x="747" y="290" text-anchor="middle">produce</text>
  <path class="arrow" d="M1060 307 H1145"/><text class="label" x="1102" y="290" text-anchor="middle">consume</text>
  <path class="arrow" d="M1445 307 H1530"/><text class="label" x="1487" y="290" text-anchor="middle">upsert</text>
  <rect class="node gap" x="645" y="425" width="870" height="52"/><text class="small" x="1080" y="457" text-anchor="middle">Important: the Spark job is mounted but not auto-submitted, and its current localhost endpoints must use Docker service names.</text>
  <path class="dash" d="M1080 425 V395"/>

  <rect class="section" x="45" y="535" width="1710" height="305"/>
  <text class="section-title" x="75" y="579">Supporting services</text>
  <rect class="node support" x="85" y="635" width="270" height="120"/><text class="h" x="220" y="676" text-anchor="middle">PostgreSQL</text><text class="t" x="220" y="706" text-anchor="middle">Airflow metadata database</text><text class="small" x="220" y="733" text-anchor="middle">persistent named volume</text>
  <rect class="node support" x="430" y="635" width="270" height="120"/><text class="h" x="565" y="676" text-anchor="middle">ZooKeeper</text><text class="t" x="565" y="706" text-anchor="middle">Kafka coordination</text><text class="small" x="565" y="733" text-anchor="middle">single local node</text>
  <rect class="node support" x="775" y="615" width="270" height="160"/><text class="h" x="910" y="656" text-anchor="middle">Schema Registry</text><text class="t" x="910" y="686" text-anchor="middle">Available on port 8081</text><text class="small" x="910" y="716" text-anchor="middle">Current producer sends plain JSON</text><text class="small" x="910" y="741" text-anchor="middle">No registered schema is used</text>
  <rect class="node support" x="1120" y="615" width="270" height="160"/><text class="h" x="1255" y="656" text-anchor="middle">Control Center</text><text class="t" x="1255" y="686" text-anchor="middle">Kafka monitoring UI</text><text class="small" x="1255" y="716" text-anchor="middle">Topics, brokers, messages</text><text class="small" x="1255" y="741" text-anchor="middle">Local development only</text>
  <rect class="node support" x="1465" y="635" width="245" height="120"/><text class="h" x="1587" y="676" text-anchor="middle">Spark cluster</text><text class="t" x="1587" y="706" text-anchor="middle">Master + one worker</text><text class="small" x="1587" y="733" text-anchor="middle">connector packages required</text>
  <path class="arrow" d="M220 635 C220 550 562 550 562 395"/><path class="arrow" d="M565 635 C565 540 925 540 925 385"/><path class="dash" d="M910 615 V520 H925 V385"/><path class="dash" d="M1255 615 V520 H965 V385"/><path class="arrow" d="M1587 635 C1587 525 1295 525 1295 395"/>
  <text class="small" x="900" y="885" text-anchor="middle">Solid arrows = active architectural dependency • dashed arrows = optional/operational dependency or configuration gap</text>
</svg>
