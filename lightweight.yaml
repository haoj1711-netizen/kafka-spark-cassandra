version: '3.8'

services:
  # ------------------------------------------------------------------
  # 1. METADATA & ORCHESTRATION (Airflow Core)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:14-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 256M # 🧠 Capped down from unlimited

  webserver:
    image: enterprise-dataops-airflow:latest
    container_name: airflow-webserver
    depends_on:
      - postgres
    environment:
      - LOAD_EXAMPLER=false
      - EXECUTOR=LocalExecutor
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    deploy:
      resources:
        limits:
          memory: 512M # 🧠 Lean web server limit

  scheduler:
    image: enterprise-dataops-airflow:latest
    container_name: airflow-scheduler
    depends_on:
      - postgres
    environment:
      - LOAD_EXAMPLER=false
      - EXECUTOR=LocalExecutor
    volumes:
      - ./dags:/opt/airflow/dags
    deploy:
      resources:
        limits:
          memory: 512M

  # ------------------------------------------------------------------
  # 2. MESSAGING CORE (Confluent Ecosystem Stripped Down)
  # ------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    deploy:
      resources:
        limits:
          memory: 256M # 🧠 Zookeeper doesn't need much space

  broker:
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # ⚡ CRITICAL OPTIMIZATION FOR RAM:
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m" 
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
    deploy:
      resources:
        limits:
          memory: 384M

  # ------------------------------------------------------------------
  # 3. PROCESSING & STORAGE (Spark & Cassandra)
  # ------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.4.1
    container_name: spark-master
    command: bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080" # Spark Master Web UI
      - "7077:7077"
    deploy:
      resources:
        limits:
          memory: 1G # 🧠 Hard ceiling on computation sizing

  spark-worker:
    image: apache/spark:3.4.1
    container_name: spark-worker
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1G
    deploy:
      resources:
        limits:
          memory: 1.2G

  cassandra_db:
    image: cassandra:4.1
    container_name: cassandra_db
    ports:
      - "9042:9042"
    environment:
      # ⚡ CRITICAL OPTIMIZATION FOR CASSANDRA:
      # Forces Cassandra to use standard min heap limits instead of consuming 1/4 of system RAM.
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  confluent:
    driver: bridge